[package]
name = "assistant"
version = "0.2.0"
description = "A lightning-fast, privacy-first AI assistant that works seamlessly during meetings, interviews, and conversations without anyone knowing."
authors = ["Local Fork"]
license = "GPL-3.0"
repository = ""
homepage = ""
documentation = ""
readme = "../README.md"
keywords = ["ai-assistant", "tauri", "desktop-app", "privacy-first", "meeting-assistant"]
categories = ["gui", "multimedia", "accessibility", "science", "development-tools"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Named explicitly rather than inherited from `package.name`. `tauri dev` runs
# this binary directly with no .app bundle around it, and macOS labels an
# unbundled process by its executable filename — so the Cargo package name is
# what shows in the dock during development, not `productName`.
# Must stay in sync with `mainBinaryName` in tauri.conf.json.
[[bin]]
name = "Aileron"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-http = { version = "2.5.2", features = ["unsafe-headers"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-keychain = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25.6"
xcap = "0.0.12"
base64 = "0.22"
cpal = "0.15.3"
hound = "3.5.1"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
futures-util = "0.3"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
ringbuf = "0.4.8"
tauri-plugin-shell = "2.3.1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-permissions = "2"
cidre = "0.11.3"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "18ffb9a201fbf6fedfaa382fd4b92315ea30ab1a" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
fluidaudio-rs = { path = "vendor/fluidaudio-rs" }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.19.0"

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Silero VAD without FluidAudio: a C port with embedded weights, no runtime deps.
silero-vad-crs = "0.4.0"
# Already in the tree through tauri-plugin-http: live text from a local server.
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree through tao/wry: lets the overlay resize on Linux.
gtk = "0.18"
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"
# One Aileron at a time: a second launch brings the running one forward.
tauri-plugin-single-instance = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.0"
