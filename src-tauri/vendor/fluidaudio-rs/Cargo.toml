[package]
name = "fluidaudio-rs"
version = "0.15.6-assistant.1"
edition = "2021"
description = "Assistant-owned Rust bindings for FluidAudio ASR, VAD, and speaker diarization on Apple platforms"
license = "MIT"
repository = "https://github.com/FluidInference/fluidaudio-rs"
keywords = ["audio", "speech-recognition", "asr", "vad", "diarization"]
categories = ["multimedia::audio", "api-bindings"]

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
